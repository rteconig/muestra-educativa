<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco Marista — Dashboard en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c10;
    --bg-2:#0d1017;
    --surface:#12151c;
    --border:rgba(255,255,255,.08);
    --text:#f5f6f8;
    --text-dim:#a7adba;
    --text-faint:#787e8d;

    --turno1:#8b5cf6;
    --turno2:#22d3c8;
    --efectivo:#34d399;
    --mp:#38bdf8;

    --c1:#ff5d5d;
    --c2:#4c6fff;
    --c3:#e8449b;
    --c4:#6fcf63;
    --c5:#ff7a45;
    --c6:#ffb020;
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  html, body{ height:100%; }

  body{
    background:radial-gradient(ellipse at top, var(--bg-2), var(--bg) 60%);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    height:100vh;
    overflow:hidden;
    padding:max(12px, 1.5vw) max(16px, 2vw) max(8px, 1vw);
    display:flex;
    flex-direction:column;
    gap:clamp(10px, 1.5vh, 16px);
  }

  .mono{font-family:'JetBrains Mono', monospace;}

  /* ---------- header ---------- */
  header{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:clamp(12px, 3vw, 28px);
    min-height:auto;
    padding:clamp(8px, 2vh, 16px) 0;
  }

  .live-indicator{
    justify-self:start;
    display:flex; 
    align-items:center; 
    gap:clamp(6px, 1vw, 11px);
    font-size:clamp(14px, 2vw, 22px); 
    color:var(--text-dim);
    min-width:0;
  }

  .live-dot{
    width:clamp(10px, 1.5vw, 13px);
    height:clamp(10px, 1.5vw, 13px);
    border-radius:50%; 
    background:#ff4d4d;
    flex-shrink:0;
    animation:pulse 1.8s ease-out infinite;
  }

  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(255,77,77,.55);}
    70%{box-shadow:0 0 0 12px rgba(255,77,77,0);}
    100%{box-shadow:0 0 0 0 rgba(255,77,77,0);}
  }

  .brand{ 
    display:flex; 
    align-items:center; 
    gap:clamp(8px, 2vw, 22px); 
    justify-self:center;
    min-width:0;
  }

  .brand-logo{ 
    width:clamp(60px, 10vw, 100px); 
    height:clamp(60px, 10vw, 100px); 
    flex:none; 
  }

  .brand-text{ text-align:left; }
  .brand h1{ 
    font-size:clamp(32px, 8vw, 74px); 
    font-weight:700; 
    letter-spacing:-0.01em;
    line-height:1;
  }
  .brand p{ 
    color:var(--text-dim); 
    font-size:clamp(12px, 2vw, 19px); 
    margin-top:clamp(2px, 0.5vh, 5px); 
  }

  .live-block{ 
    justify-self:end; 
    text-align:right;
    min-width:0;
  }

  .total-general{ 
    font-size:clamp(36px, 8vw, 76px); 
    font-weight:700; 
    margin-top:clamp(1px, 0.5vh, 2px);
    line-height:1;
  }

  .total-label{ 
    color:var(--text-dim); 
    font-size:clamp(12px, 2vw, 16px); 
  }

  /* ---------- legend ---------- */
  .legend{
    display:flex; 
    gap:clamp(12px, 3vw, 30px); 
    flex-wrap:wrap; 
    align-items:center; 
    justify-content:center;
    padding:clamp(8px, 1.5vh, 12px) clamp(12px, 2vw, 20px); 
    background:var(--surface); 
    border:1px solid var(--border);
    border-radius:clamp(6px, 1vw, 10px); 
    font-size:clamp(12px, 1.8vw, 18px); 
    color:var(--text-dim);
    text-transform:uppercase; 
    letter-spacing:.04em;
    min-height:auto;
  }

  .legend span{
    display:flex;
    align-items:center;
    gap:clamp(5px, 1vw, 9px);
  }

  .chip{
    width:clamp(10px, 1.5vw, 14px);
    height:clamp(10px, 1.5vw, 14px);
    border-radius:3px;
    display:inline-block;
    flex-shrink:0;
  }

  /* ---------- ranking chart ---------- */
  .ranking{
    display:flex; 
    align-items:flex-end; 
    gap:clamp(8px, 2vw, 18px);
    padding:clamp(12px, 1.5vw, 16px) clamp(16px, 2vw, 24px) clamp(6px, 1vh, 10px); 
    background:var(--surface); 
    border:1px solid var(--border);
    border-radius:clamp(10px, 1.5vw, 14px); 
    height:clamp(100px, 20vh, 150px);
    overflow-x:auto;
  }

  .rank-col{ 
    flex:1; 
    display:flex; 
    flex-direction:column; 
    align-items:center; 
    height:100%;
    min-width:clamp(40px, 8vw, 60px);
  }

  .rank-val{ 
    font-size:clamp(14px, 2vw, 19px); 
    font-weight:700; 
    margin-bottom:clamp(3px, 1vh, 6px); 
  }

  .rank-bar-track{ flex:1; width:100%; display:flex; align-items:flex-end; }
  .rank-bar{ width:56%; margin:0 auto; border-radius:7px 7px 0 0; transition:height .5s ease; }

  .rank-name{ 
    font-size:clamp(12px, 1.8vw, 16px); 
    color:var(--text-dim); 
    margin-top:clamp(4px, 1vh, 8px); 
    font-weight:500; 
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* ---------- grid ---------- */
  .grid{
    flex:1; 
    display:grid; 
    grid-template-columns:repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    gap:clamp(12px, 2vw, 16px); 
    min-height:0;
    overflow-y:auto;
    padding-right:clamp(0px, 1vw, 8px);
  }

  .grid::-webkit-scrollbar {
    width:6px;
  }
  .grid::-webkit-scrollbar-track {
    background:transparent;
  }
  .grid::-webkit-scrollbar-thumb {
    background:rgba(255,255,255,.1);
    border-radius:3px;
  }

  .card{
    background:var(--surface); 
    border:1px solid var(--border); 
    border-radius:clamp(12px, 1.5vw, 16px);
    overflow:hidden; 
    display:flex; 
    flex-direction:column;
    min-height:0;
  }

  .card-tag{ height:clamp(5px, 1vh, 7px); width:100%; }

  .card-inner{
    padding:clamp(12px, 2vh, 18px) clamp(14px, 2vw, 22px); 
    display:flex; 
    flex-direction:column;
    gap:clamp(6px, 1.5vh, 10px); 
    flex:1; 
    min-height:0; 
    justify-content:space-between;
    overflow-y:auto;
  }

  .card-inner::-webkit-scrollbar {
    width:4px;
  }
  .card-inner::-webkit-scrollbar-track {
    background:transparent;
  }
  .card-inner::-webkit-scrollbar-thumb {
    background:rgba(255,255,255,.1);
    border-radius:2px;
  }

  .card-top{ 
    display:flex; 
    justify-content:space-between; 
    align-items:baseline;
    gap:clamp(8px, 1.5vw, 12px);
    min-width:0;
  }

  .stand-name{ 
    font-size:clamp(18px, 4vw, 25px); 
    font-weight:700; 
    text-transform:uppercase; 
    letter-spacing:.01em;
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .ventas-badge{
    font-size:clamp(14px, 2.5vw, 22px); 
    font-weight:700;
    padding:clamp(4px, 1vh, 7px) clamp(10px, 2vw, 18px); 
    border-radius:22px;
    background:color-mix(in srgb, var(--stand-color) 16%, transparent);
    border:1px solid color-mix(in srgb, var(--stand-color) 45%, transparent);
    white-space:nowrap;
    flex-shrink:0;
  }

  .stand-total{ 
    font-size:clamp(32px, 6vw, 44px); 
    font-weight:700; 
    line-height:1;
  }

  .stand-total .sign{ 
    font-size:clamp(16px, 3vw, 22px); 
    color:var(--text-dim); 
    margin-right:clamp(1px, 0.5vw, 3px); 
    font-weight:400; 
  }

  .section-label{
    font-size:clamp(11px, 1.5vw, 14px); 
    color:var(--text-faint); 
    letter-spacing:.06em;
    text-transform:uppercase; 
    font-weight:600; 
    margin-bottom:clamp(2px, 0.5vh, 4px);
  }

  .rings-row{ 
    display:flex; 
    gap:clamp(8px, 2vw, 16px);
    flex-wrap:wrap;
  }

  .ring-block{ 
    flex:1;
    min-width:clamp(140px, 30vw, 200px);
    display:flex; 
    align-items:center; 
    gap:clamp(8px, 1.5vw, 12px); 
  }

  .donut{ 
    width:clamp(60px, 10vw, 88px); 
    height:clamp(60px, 10vw, 88px); 
    flex:none; 
  }

  .donut circle{ 
    transition:stroke-dasharray .5s ease, stroke-dashoffset .5s ease; 
  }

  .ring-legend{ 
    display:flex; 
    flex-direction:column; 
    gap:clamp(3px, 1vh, 6px); 
    flex:1; 
    min-width:0; 
  }

  .ring-item{ 
    display:flex; 
    align-items:center; 
    gap:clamp(5px, 1vw, 8px);
    min-width:0;
  }

  .ring-item .chip{ 
    width:clamp(8px, 1.5vw, 11px); 
    height:clamp(8px, 1.5vw, 11px); 
    border-radius:3px; 
    flex-none; 
  }

  .ring-item .pctg{ 
    font-size:clamp(14px, 2.5vw, 22px); 
    font-weight:700;
    white-space:nowrap;
  }

  .ring-item .amt{ 
    font-size:clamp(12px, 1.8vw, 15px); 
    color:var(--text-dim); 
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .pago-placeholder{
    flex:1; 
    display:flex; 
    align-items:center; 
    justify-content:center;
    border:1px dashed var(--border); 
    border-radius:clamp(6px, 1vw, 10px); 
    min-height:clamp(60px, 12vh, 88px);
    color:var(--text-faint); 
    font-size:clamp(12px, 1.8vw, 14px); 
    text-align:center; 
    padding:clamp(6px, 1.5vw, 8px);
  }

  /* ---------- Responsive para pantallas pequeñas ---------- */
  @media (max-width: 768px) {
    body {
      gap:clamp(8px, 1.2vh, 12px);
    }

    header {
      grid-template-columns:1fr;
      gap:clamp(8px, 1.2vh, 12px);
    }

    .live-indicator {
      justify-self:center;
      order:2;
    }

    .brand {
      justify-self:center;
      order:1;
      gap:clamp(6px, 1.5vw, 12px);
    }

    .live-block {
      justify-self:center;
      order:3;
    }

    .grid {
      grid-template-columns:1fr;
    }

    .rings-row {
      flex-direction:column;
    }

    .ring-block {
      width:100%;
      min-width:auto;
    }
  }

  @media (max-width: 480px) {
    body {
      padding:clamp(8px, 1vh, 12px) clamp(8px, 1.5vw, 12px);
      gap:clamp(6px, 1vh, 10px);
    }

    .brand-logo {
      width:clamp(40px, 8vw, 60px);
      height:clamp(40px, 8vw, 60px);
    }

    .card-inner {
      padding:clamp(10px, 1.5vh, 14px) clamp(10px, 1.5vw, 14px);
      gap:clamp(6px, 1vh, 8px);
    }

    .ranking {
      gap:clamp(6px, 1.5vw, 12px);
    }
  }
</style>
</head>
<body>

  <header>
    <div class="live-indicator"><span class="live-dot"></span>en vivo · actualizado hace <span id="secs">0</span>s</div>
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#22d3c8;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect width="120" height="120" fill="none"/>
        <g opacity="0.95">
          <rect x="20" y="20" width="25" height="25" fill="url(#grad1)" rx="4"/>
          <rect x="48" y="20" width="25" height="25" fill="url(#grad1)" rx="4" opacity="0.7"/>
          <rect x="75" y="20" width="25" height="25" fill="url(#grad1)" rx="4" opacity="0.4"/>
          <rect x="20" y="48" width="25" height="25" fill="url(#grad1)" rx="4" opacity="0.7"/>
          <rect x="48" y="48" width="25" height="25" fill="url(#grad1)" rx="4"/>
          <rect x="75" y="48" width="25" height="25" fill="url(#grad1)" rx="4" opacity="0.5"/>
          <rect x="20" y="75" width="25" height="25" fill="url(#grad1)" rx="4" opacity="0.4"/>
          <rect x="48" y="75" width="25" height="25" fill="url(#grad1)" rx="4" opacity="0.6"/>
          <rect x="75" y="75" width="25" height="25" fill="url(#grad1)" rx="4"/>
        </g>
      </svg>
      <div class="brand-text">
        <h1>Banco</h1>
        <p>Marista en vivo</p>
      </div>
    </div>
    <div class="live-block">
      <div class="total-general mono" id="total-general">$0</div>
      <div class="total-label">Total general</div>
    </div>
  </header>

  <div class="legend">
    <span><span class="chip" style="background:var(--turno1)"></span>Turno 1</span>
    <span><span class="chip" style="background:var(--turno2)"></span>Turno 2</span>
    <span><span class="chip" style="background:var(--efectivo)"></span>Efectivo</span>
    <span><span class="chip" style="background:var(--mp)"></span>Mercado Pago</span>
  </div>

  <div class="ranking" id="ranking"></div>

  <div class="grid" id="grid"></div>

<script>
  const REFRESH_MS = 8000;
  const STANDS_CONFIG = [
    { id: "Stand-1", nombre: "Local", color: "var(--c1)" },
    { id: "Stand-2", nombre: "Tienda", color: "var(--c2)" },
    { id: "Stand-3", nombre: "Kiosko", color: "var(--c3)" },
    { id: "Stand-4", nombre: "Bazar", color: "var(--c4)" },
    { id: "Stand-5", nombre: "Pastas", color: "var(--c5)" },
    { id: "Stand-6", nombre: "Bebidas", color: "var(--c6)" },
  ];

  let hasFormaDePago = false;
  const lastKnown = {};

  function fmt(n){ return n ? n.toLocaleString("es-AR", { maximumFractionDigits:0 }) : "0"; }
  function pct(n, t){ return t ? Math.round((n || 0) / t * 100) : 0; }
  function norm(s){ return (s || "").toLowerCase().trim().replace(/\s+/g, " "); }

  async function fetchStandData(id){
    const sheet = "Edición Actual";
    const url = `https://docs.google.com/spreadsheets/d/1fT1fQ6t-p4ExQHgkStKa8bQYH9F3vW8g_xB-4pXz1Jo/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}`;

    try {
      const res = await fetch(url, { mode: "no-cors" });
      const txt = await res.text();
      const json = JSON.parse(txt.substring(47).slice(0, -2));
      
      const cols = json.table.cols || [];
      const rows = json.table.rows || [];

      const idx = {};
      cols.forEach((c, i) => { idx[norm(c.label)] = i; });

      const iTurno = idx["turno"];
      const iTotal = idx["totalventa"];
      const iForma = idx["formadepago"];
      if (iForma !== undefined) hasFormaDePago = true;

      let total = 0, t1 = 0, t2 = 0, efectivo = 0, mp = 0, ventas = 0;

      rows.forEach(r => {
        const cells = r.c || [];
        const turno = (iTurno !== undefined && cells[iTurno]) ? String(cells[iTurno].v || "") : "";
        const monto = (iTotal !== undefined && cells[iTotal] && cells[iTotal].v != null) ? Number(cells[iTotal].v) || 0 : 0;
        if (!monto) return;

        total += monto;
        ventas++;
        if (turno.includes("1")) t1 += monto;
        else if (turno.includes("2")) t2 += monto;

        if (iForma !== undefined && cells[iForma]) {
          const forma = norm(cells[iForma].v);
          if (forma.includes("efect")) efectivo += monto;
          else if (forma.includes("mercado") || forma === "mp") mp += monto;
        }
      });

      const data = { total, t1, t2, efectivo, mp, ventas };
      lastKnown[id] = data;
      return data;
    } catch (err){
      console.warn("Fallo el fetch de", id, err);
      const fallback = lastKnown[id] || { total:0, t1:0, t2:0, efectivo:0, mp:0, ventas:0 };
      return fallback;
    }
  }

  async function fetchAllStands(){
    const results = await Promise.all(STANDS_CONFIG.map(async cfg => {
      try {
        const data = await fetchStandData(cfg.id);
        return { ...cfg, ...data };
      } catch (err){
        console.warn("Fallo el fetch de", cfg.nombre, err);
        const fallback = lastKnown[cfg.id] || { total:0, t1:0, t2:0, efectivo:0, mp:0, ventas:0 };
        return { ...cfg, ...fallback };
      }
    }));
    return results;
  }

  function ring(colorA, colorB, pA, pB){
    return `
      <svg class="donut" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="14" fill="none" stroke="#1c202b" stroke-width="8"></circle>
        <circle cx="18" cy="18" r="14" fill="none" stroke="${colorA}" stroke-width="8"
                pathLength="100" stroke-dasharray="${pA} 100" stroke-dashoffset="0"
                transform="rotate(-90 18 18)" stroke-linecap="round"></circle>
        <circle cx="18" cy="18" r="14" fill="none" stroke="${colorB}" stroke-width="8"
                pathLength="100" stroke-dasharray="${pB} 100" stroke-dashoffset="${-pA}"
                transform="rotate(-90 18 18)" stroke-linecap="round"></circle>
      </svg>`;
  }

  function ringBlock(sectionLabel, colorA, colorB, lblA, lblB, pA, pB, amtA, amtB){
    return `
      <div style="flex:1">
        <div class="section-label">${sectionLabel}</div>
        <div class="ring-block">
          ${ring(colorA, colorB, pA, pB)}
          <div class="ring-legend">
            <div class="ring-item"><span class="chip" style="background:${colorA}"></span><span class="pctg mono">${pA}%</span></div>
            <div class="ring-item amt">${lblA} · ${amtA}</div>
            <div class="ring-item"><span class="chip" style="background:${colorB}"></span><span class="pctg mono">${pB}%</span></div>
            <div class="ring-item amt">${lblB} · ${amtB}</div>
          </div>
        </div>
      </div>`;
  }

  function pagoPlaceholder(){
    return `
      <div class="pago-placeholder">
        <div>
          <div class="section-label" style="margin-bottom:6px">forma de pago</div>
          disponible en la próxima edición
        </div>
      </div>`;
  }

  function render(stands){
    const totalGeneral = stands.reduce((acc, s) => acc + s.total, 0);
    document.getElementById("total-general").textContent = fmt(totalGeneral);

    const rankingEl = document.getElementById("ranking");
    rankingEl.innerHTML = "";
    const maxTotal = Math.max(1, ...stands.map(s => s.total));
    [...stands].sort((a,b) => b.total - a.total).forEach(s => {
      const h = Math.max(6, Math.round((s.total / maxTotal) * 100));
      const col = document.createElement("div");
      col.className = "rank-col";
      col.innerHTML = `
        <div class="rank-val mono">${fmt(s.total)}</div>
        <div class="rank-bar-track"><div class="rank-bar" style="height:${h}%; background:${s.color}"></div></div>
        <div class="rank-name">${s.nombre}</div>
      `;
      rankingEl.appendChild(col);
    });

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    stands.forEach(s => {
      const p1 = pct(s.t1, s.total), p2 = 100 - p1;
      const pe = pct(s.efectivo, s.total), pm = 100 - pe;

      const segundoBloque = hasFormaDePago
        ? ringBlock("forma de pago", "var(--efectivo)", "var(--mp)", "Efec.", "MP", pe, pm, fmt(s.efectivo), fmt(s.mp))
        : pagoPlaceholder();

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="card-tag" style="background:${s.color}"></div>
        <div class="card-inner">
          <div class="card-top">
            <div class="stand-name" style="color:${s.color}">${s.nombre}</div>
            <div class="ventas-badge" style="--stand-color:${s.color}; color:${s.color}">${s.ventas} ventas</div>
          </div>

          <div class="stand-total mono"><span class="sign">$</span>${s.total.toLocaleString("es-AR", { minimumFractionDigits:2, maximumFractionDigits:2 })}</div>

          <div class="rings-row">
            ${ringBlock("turno", "var(--turno1)", "var(--turno2)", "T1", "T2", p1, p2, fmt(s.t1), fmt(s.t2))}
            ${segundoBloque}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  let secs = 0;
  async function refresh(){
    try {
      const stands = await fetchAllStands();
      render(stands);
      secs = 0;
    } catch (err){
      console.error("Error al refrescar el dashboard:", err);
    }
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
  setInterval(() => {
    secs++;
    document.getElementById("secs").textContent = secs;
  }, 1000);
</script>

</body>
</html>
